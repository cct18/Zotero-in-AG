[project]
name = "zotero-in-ag"
version = "2.3.0"
description = "Zotero in AG: Native literature viewer, PDF reader, and MCP academic tools for Google Antigravity."
readme = "README.md"
authors = [
    { name = "parallel", email = "3045624897@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "mcp>=2.3.0,<3",
    "pydantic>=2.10.0",
    "pypdf>=5.1.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
